version: 2
project_name: sitrep
builds:
  - main: ./cmd/sitrep
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/zebadrabbit/sitrep/internal/version.Version={{.Version}}
      - -X github.com/zebadrabbit/sitrep/internal/version.Commit={{.ShortCommit}}
      - -X github.com/zebadrabbit/sitrep/internal/version.Date={{.Date}}
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, docs/THEMING.md]
checksum:
  name_template: checksums.txt
changelog:
  use: git
  filters:
    exclude: ["^docs:", "^test:"]
