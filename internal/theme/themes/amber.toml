# sitrep default theme. Colors are hex; leave empty for the terminal default.
# fg/bg are intentionally absent: sitrep never paints a background.
name   = "amber"
accent = "#F5A623"
ok     = "#7CB342"
warn   = "#F5A623"
crit   = "#E53935"
dim    = "#6B6B6B"
port   = "#4DD0E1"   # port numbers in the Ports tab
ascii  = false
